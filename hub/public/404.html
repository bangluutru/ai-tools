<!DOCTYPE html>
<!--
  Trang 404 thật cho Cloudflare Pages. Có file này thì Pages trả mã 404 cho đường
  dẫn không có file, thay vì trả index.html với mã 200 (soft 404: Google coi là
  trang trùng trang chủ, máy quét /.env hay /wp-admin tưởng là có thật).

  Cái giá: Pages thôi fallback SPA. Mọi route thật phải có file tĩnh do
  scripts/prerender.mjs sinh ra, hoặc một dòng trong public/_redirects.

  Cố ý không tải bundle của app: trang này phải hiện được cả khi JS hỏng.
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy trang — Toolio | ChottoDay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1020; --fg: #e2e8f0; --muted: #94a3b8; --accent: #818cf8; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
      main { max-width: 560px; padding: 32px 16px; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      a { color: var(--accent); font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
      nav a { margin: 0 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Không tìm thấy trang</h1>
      <p>Đường dẫn này không có trên Toolio. Có thể công cụ đã đổi tên, hoặc link bị gõ sai.</p>
      <nav>
        <a href="/">Trang chủ Toolio</a>
        <a href="/tools">Công cụ</a>
        <a href="/japan-life">Đời sống Nhật Bản</a>
        <a href="/vietnam-life">Đời sống Việt Nam</a>
      </nav>
    </main>
  </body>
</html>
