<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="toolioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141F36"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <!-- Left Piece: Mint-Emerald Gradient -->
    <linearGradient id="toolioMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EDEA3"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Right Piece: Sky Cyan Gradient -->
    <linearGradient id="toolioCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="toolioDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="url(#toolioBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Rim Specular Highlight -->
  <path d="M 25 3.5 Q 50 2 75 3.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Interlocking "T" Puzzle Glyphs -->
  <g filter="url(#toolioDepth)">
    <!-- LEFT PIECE (Mint-Emerald with Jigsaw Tab) -->
    <path d="
      M 49.3 18
      L 21 18
      A 4 4 0 0 0 17 22
      L 17 36
      A 4 4 0 0 0 21 40
      L 35 40
      L 35 78
      A 4 4 0 0 0 39 82
      L 49.3 82
      L 49.3 58.5
      C 47.8 58.0 47.0 57.0 49.48 56.9
      A 5.8 5.8 0 1 0 49.48 51.1
      C 47.0 51.0 47.8 50.0 49.3 49.5
      Z
    " fill="url(#toolioMint)"/>

    <!-- RIGHT PIECE (Sky Cyan with Complementary Socket) -->
    <path d="
      M 50.7 18
      L 79 18
      A 4 4 0 0 1 83 22
      L 83 36
      A 4 4 0 0 1 79 40
      L 65 40
      L 65 78
      A 4 4 0 0 1 61 82
      L 50.7 82
      L 50.7 59.5
      C 49.2 59.0 48.4 58.0 50.88 56.9
      A 5.8 5.8 0 1 1 50.88 51.1
      C 48.4 51.0 49.2 50.0 50.7 48.5
      Z
    " fill="url(#toolioCyan)"/>
  </g>
</svg>