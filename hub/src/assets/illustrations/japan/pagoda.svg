  <line x1="72" y1="112" x2="72" y2="136" stroke-width="1.4" />
  <line x1="88" y1="112" x2="88" y2="136" stroke-width="1.4" />
  <!-- Center entrance door -->
  <path d="M75 136 V122 C75 120, 85 120, 85 122 V136" stroke-width="1.4" fill="currentColor" fill-opacity="0.15" />

  <!-- Foundation Stone Platform -->
  <path d="M46 136 H114 L120 144 H40 Z" fill="currentColor" fill-opacity="0.18" stroke-width="1.6" />
</svg>
