<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <!-- Central Spire / Mast (Sorin) -->
  <line x1="80" y1="12" x2="80" y2="38" stroke-width="2" />
